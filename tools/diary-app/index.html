<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KM 업무일지</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#263d32;font:13px 'Malgun Gothic','Noto Sans CJK KR',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#1d3d31;color:white;padding:14px 20px;display:flex;align-items:center;gap:18px}h1{font-size:19px;margin:0}header small{color:#c3d4c8}header button{margin-left:auto}button,.select{padding:8px 11px;border:1px solid #cadbcf;background:white;color:#326047;border-radius:5px}.status{padding:9px 20px;font-size:11px;color:#69806e;background:#e9f2ec;overflow-wrap:anywhere}.warning{background:#fff2d8;color:#845e1b;padding:10px 18px;line-height:1.7;display:none}main{padding:12px}.panel{background:white;border:1px solid #d4e0d7;border-radius:8px;overflow:hidden}.toolbar{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #dce5df;flex-wrap:wrap}#search{width:270px;padding:9px 11px;border:1px solid #d4e0d7;border-radius:4px}#sheet{max-width:280px}.count{margin-left:auto;color:#7b8d81;font-size:11px}.scroll{overflow:auto;max-height:calc(100vh - 250px);min-height:350px}table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}th{position:sticky;top:0;background:#eaf2ed;color:#436752;padding:10px;text-align:left;font-size:12px;border-right:1px solid #d4e0d7;border-bottom:1px solid #cbdacf;z-index:1}td{padding:12px 11px;vertical-align:top;border-right:1px solid #e0e8e2;border-bottom:1px solid #e0e8e2;line-height:1.9;overflow-wrap:anywhere}tr:nth-child(even) td{background:#fafcfb}.subject{font-size:13px;font-weight:bold;margin-bottom:7px}.meta{font-size:10px;color:#84958a;line-height:1.85}.text{white-space:pre-wrap;line-height:1.9}.label{color:#478064;font-size:10px;font-weight:bold;margin-bottom:5px}.part+.part{border-top:1px dashed #dce5df;margin-top:11px;padding-top:10px}.clamp .text{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}.more{border:0;padding:4px 0;background:none;font-size:10px;color:#43805d}.open{font-size:10px;margin-top:10px}details{padding:6px 0;border-bottom:1px solid #e2e9e4}summary{cursor:pointer;font-size:11px;color:#47735a;font-weight:bold;margin-bottom:4px}.tabs{display:flex;overflow:auto;background:#f5f8f6;border-top:1px solid #cfded3;padding:0 6px;min-height:48px;scrollbar-width:thin}.tabs button{white-space:nowrap;border:0;border-radius:0;border-right:1px solid #e0e7e2;background:transparent;border-bottom:3px solid transparent;font-size:11px;padding:12px 14px;color:#6b8473}.tabs button.on{background:white;color:#276746;font-weight:bold;border-bottom-color:#318357}.tabs small{margin-left:5px;color:#91a296}.foot{padding:8px 12px;font-size:10px;color:#84968a}.paging{display:flex;align-items:center;gap:10px;font-size:11px;color:#6b8473}.overlay{position:fixed;inset:0;background:#122a20aa;z-index:10;display:none;align-items:center;justify-content:center}.overlay.show{display:flex}.dialog{background:white;border-radius:10px;width:800px;max-width:95vw;max-height:90vh;overflow:auto}.dialoghead{padding:14px 18px;position:sticky;top:0;background:white;border-bottom:1px solid #d6e2da;z-index:2;display:flex;align-items:center;gap:8px}.dialoghead b{margin-right:auto}.dialogbody{padding:14px 20px}.field{padding:12px 0;border-bottom:1px solid #e4ebe6}.field label{font-size:11px;color:#5d826a;display:block;margin-bottom:7px}.field textarea{width:100%;padding:10px;line-height:1.9;min-height:80px;border:1px solid #cfded4;border-radius:5px;color:#2d4b39;resize:vertical;background:#fcfefc}.field textarea.short{min-height:45px;height:45px}.primary{background:#2d7152;color:white;border-color:#2d7152}.info{font-size:11px;padding:10px 12px;background:#f0f6f2;color:#62806a;line-height:1.8;margin-bottom:8px}.err{color:#a34335;font-size:12px;white-space:pre-wrap}.dirty{color:#9a731f;font-size:11px}.busy{padding:45px;text-align:center;color:#758e7c}button:disabled{opacity:.45;cursor:default}.file{font-size:10px;margin-top:5px;color:#83958a}#mobileTitle{display:none}@media(max-width:650px){header{padding:12px;flex-wrap:wrap;gap:8px}header h1{font-size:17px}header small{font-size:10px}header button{font-size:10px}.status{padding:8px 12px}main{padding:7px}.toolbar{gap:7px;padding:9px}#search{width:100%}#sheet{max-width:170px}.scroll{max-height:calc(100vh - 300px)}th{font-size:10px;padding:8px 5px}td{padding:9px 5px;font-size:11px}.subject{font-size:11px}.meta{font-size:9px}.label{font-size:9px}.paging{margin-left:0}.dialoghead{flex-wrap:wrap}.dialogbody{padding:12px}.field textarea{font-size:12px}}
</style><header><div><h1>KM 업무일지</h1><small>엑셀 파일에 연결된 업무일지 · 회의록</small></div><button onclick="downloadWorkbook()">현재 엑셀 내려받기</button></header><div class="status" id="status">파일을 읽고 있습니다…</div><div class="warning" id="warning"></div><main><div class="panel"><div class="toolbar"><select class="select" id="sheet" aria-label="원본 시트 선택" onchange="selectSheet(this.value)"></select><input id="search" placeholder="현장·담당자·내용 검색" oninput="page=0;render()"><button onclick="refresh(true)">파일 다시 읽기</button><span class="count" id="count"></span><div class="paging"><button id="prev" onclick="page--;render()">‹</button><span id="page"></span><button id="next" onclick="page++;render()">›</button></div></div><div class="scroll"><table id="grid"></table></div><div class="tabs" id="tabs" role="tablist" aria-label="현장별 보기"></div><div class="foot" id="foot">실제 엑셀 저장 · 수정 전 백업 · 파일 변경 감지</div></div></main><div class="overlay" id="overlay"><div class="dialog"><div class="dialoghead"><b id="recordTitle">회의록 상세</b><span id="dirty"></span><button id="editBtn" onclick="startEdit()">내용 수정</button><button class="primary" id="saveBtn" onclick="saveEdit()" hidden>엑셀에 저장</button><button onclick="closeDialog()">닫기 ✕</button></div><div class="dialogbody" id="detail"></div></div></div><script>
const TOKEN='__TOKEN__',HEADS=['날짜','현장명','담당자','협의 항목','협의 내용','결정 사항','조치 사항','특이 사항','결정할 사항','전달할 사항','캘린더에 들어갈 사항'];let book=null,currentSheet='',site='',page=0,record=null,editMode=false,pending=false,refreshing=false;const PAGE=35,$=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'X-KM-Token':TOKEN,...(options.body?{'Content-Type':'application/json'}:{})}});const j=await r.json();if(!r.ok){const e=new Error(j.error||'처리 실패');e.status=r.status;throw e}return j}
function warn(msg){$('#warning').textContent=msg;$('#warning').style.display=msg?'block':'none'}
function sheetData(){return book?.sheets.find(s=>s.name===currentSheet)}
async function refresh(manual=false){if(refreshing)return;refreshing=true;try{const incoming=await api('/api/data');if(book&&incoming.revision!==book.revision&&editMode){warn('엑셀이 다른 곳에서 바뀌었습니다. 입력 내용은 보존되지만 현재 상태로 덮어쓸 수 없습니다. 수정 내용을 복사해 둔 뒤 닫고 파일을 다시 읽어 주세요.');return;}const changed=!book||incoming.revision!==book.revision;book=incoming;if(!currentSheet||!sheetData())currentSheet=book.defaultSheet;if(changed||manual){$('#sheet').replaceChildren();for(const s of book.sheets){const o=document.createElement('option');o.value=s.name;o.textContent=s.name+' · '+s.rows.length+'행';o.selected=s.name===currentSheet;$('#sheet').append(o)}render();if(record&&!editMode){record=sheetData()?.rows.find(r=>r.row===record.row)||null;if(record)drawRecord(false)}}$('#status').textContent='연결 파일: '+book.path+'　|　저장 위치는 이 파일입니다. 수정 전 같은 폴더의 업무일지_백업에 사본을 만듭니다.';if(manual)warn('')}catch(e){warn(e.message)}finally{refreshing=false}}
function selectSheet(name){currentSheet=name;site='';page=0;$('#search').value='';render()}
function rows(){const s=sheetData();if(!s)return[];const q=$('#search').value.trim().toLowerCase();return s.rows.filter(r=>(!site||r.values[1]===site)&&(!q||r.values.join(' ').toLowerCase().includes(q)))}
function cellPart(r,j){const v=r.values[j];if(!v)return'';const long=v.length>280||v.split('\n').length>7;const block=`<div class="part ${long?'clamp':''}"><div class="label">${HEADS[j]}</div><div class="text">${esc(v)}</div>${long?'<button class="more" onclick="expand(this)">전체 펼치기 ▾</button>':''}</div>`;return j>=7?`<details ${j===8?'open':''}><summary>${HEADS[j]}</summary>${block}</details>`:block}
function expand(b){const closed=b.parentElement.classList.toggle('clamp');b.textContent=closed?'전체 펼치기 ▾':'접기 ▴'}
function render(){const s=sheetData();if(!s)return;const all=rows();const pages=Math.max(1,Math.ceil(all.length/PAGE));page=Math.max(0,Math.min(page,pages-1));const visible=all.slice(page*PAGE,(page+1)*PAGE);$('#count').textContent=(site||'전체')+' · '+all.length+'행';$('#page').textContent=(page+1)+' / '+pages;$('#prev').disabled=page===0;$('#next').disabled=page>=pages-1;
if(s.standard){$('#grid').style.minWidth='0';$('#grid').innerHTML='<colgroup><col style="width:18%"><col style="width:34%"><col style="width:25%"><col style="width:23%"></colgroup><thead><tr><th>협의 항목 · 담당자</th><th>협의 내용</th><th>결정 · 조치</th><th>확인 · 전달 · 일정</th></tr></thead><tbody>'+visible.map(r=>`<tr><td><div class="subject">${esc(r.values[3])}</div><div class="meta">${esc(r.values[0])}${site?'':'<br>'+esc(r.values[1])}<br>${esc(r.values[2])}</div><button class="open" onclick="openRecord(${r.row})">기록 보기 · 수정 ↗</button><div class="file">${esc(s.name)} · ${r.row}행</div></td><td>${cellPart(r,4)}</td><td>${cellPart(r,5)+cellPart(r,6)}</td><td>${[7,8,9,10].map(j=>cellPart(r,j)).join('')}</td></tr>`).join('')+'</tbody>';
const counts=new Map();s.rows.forEach(r=>counts.set(r.values[1],(counts.get(r.values[1])||0)+1));$('#tabs').replaceChildren();for(const[n,count]of [['',s.rows.length],...counts]){const b=document.createElement('button');b.type='button';b.className=site===n?'on':'';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(site===n));b.textContent=(n||'전체')+'　'+count;b.onclick=()=>{site=n;page=0;render()};$('#tabs').append(b)}$('#tabs').style.display='flex';
}else{$('#grid').style.minWidth=Math.max(650,s.headers.length*150)+'px';$('#grid').innerHTML='<thead><tr>'+s.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+visible.map(r=>'<tr>'+r.values.map(v=>'<td class="text">'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody>';$('#tabs').style.display='none'}if(!all.length)$('#grid').insertAdjacentHTML('beforeend','<tbody><tr><td colspan="'+(s.standard?4:s.headers.length)+'" style="padding:35px;text-align:center">검색 결과가 없습니다.</td></tr></tbody>'.replace('검색 결과가 없습니다.','검색 결과가 없습니다.'));$('#foot').textContent=s.standard?'내용 수정 → 엑셀에 저장 → 업무일지·회의록 함께 갱신 / 같은 원본 병합 셀을 쓰는 행은 함께 바뀝니다.':'원본 보조 시트입니다. 표 조회만 지원하며 이 화면에서 수정하지 않습니다.'}
function openRecord(row){record=sheetData().rows.find(r=>r.row===row);if(!record)return;editMode=false;pending=false;drawRecord(false);$('#overlay').classList.add('show');$('#overlay').setAttribute('role','dialog');$('#overlay').setAttribute('aria-modal','true')}
function drawRecord(edit){$('#recordTitle').textContent=currentSheet+' · '+record.row+'행';$('#editBtn').hidden=edit;$('#saveBtn').hidden=!edit;$('#dirty').textContent='';$('#detail').innerHTML='<div class="info">'+(edit?'이 내용을 저장하면 연결된 엑셀 파일이 실제로 변경됩니다. 원본이 병합 셀인 항목은 해당 회의의 여러 행에 함께 반영됩니다. 수정 전 자동 백업합니다.':'이 화면은 현재 연결된 엑셀 파일에서 읽은 기록입니다.')+'</div><div id="editError" class="err"></div>'+HEADS.map((h,j)=>{const merged=sheetData().rows.filter(r=>r.roots[j]===record.roots[j]).length;return '<div class="field"><label for="f'+j+'">'+h+(merged>1?' · '+merged+'행이 공유하는 병합 셀':'')+'</label>'+(edit?'<textarea id="f'+j+'" data-column="'+j+'" class="'+(j<4?'short':'')+'">'+esc(record.values[j])+'</textarea>':'<div class="text">'+(esc(record.values[j])||'기재 없음')+'</div>')+'</div>'}).join('');if(edit)$('#detail').querySelectorAll('textarea').forEach(t=>t.oninput=()=>{pending=true;$('#dirty').textContent='저장 전 수정 중';$('#dirty').className='dirty'})}
function startEdit(){editMode=true;drawRecord(true)}
async function saveEdit(){if(!editMode||!record)return;const changes=[...$('#detail').querySelectorAll('textarea')].map(t=>({column:Number(t.dataset.column),value:t.value})).filter(c=>c.value!==record.values[c.column]);if(!changes.length){editMode=false;pending=false;drawRecord(false);return}$('#saveBtn').disabled=true;$('#saveBtn').textContent='엑셀에 저장 중…';let saved=0;try{for(const c of changes){const result=await api('/api/edit',{method:'POST',body:JSON.stringify({sheet:currentSheet,row:record.row,column:c.column,value:c.value,revision:book.revision})});saved++;const incoming=await api('/api/data');book=incoming;if(result.warning)warn(result.warning)}const row=record.row;record=sheetData().rows.find(r=>r.row===row);pending=false;editMode=false;render();drawRecord(false);$('#dirty').textContent='엑셀 저장 완료 · '+saved+'항목';$('#dirty').style.color='#3a8657'}catch(e){$('#editError').textContent=(saved?saved+'항목은 저장됐습니다. 나머지 내용은 현재 화면에 남아 있습니다.\n':'')+e.message}finally{$('#saveBtn').disabled=false;$('#saveBtn').textContent='엑셀에 저장'}}
function closeDialog(){if(pending&&!confirm('아직 엑셀에 저장하지 않은 수정이 있습니다. 닫을까요?'))return;pending=false;editMode=false;record=null;$('#overlay').classList.remove('show')}
async function downloadWorkbook(){try{const r=await fetch('/api/download',{headers:{'X-KM-Token':TOKEN}});if(!r.ok)throw Error('다운로드 실패');const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=book.file;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){warn(e.message)}}
window.addEventListener('beforeunload',e=>{if(pending){e.preventDefault();e.returnValue=''}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').classList.contains('show'))closeDialog()});refresh();setInterval(()=>refresh(),8000);
</script></html>
